name: 项目收录申请
description: 申请将独立的 2026 电赛开源仓库加入汇总索引
title: "[收录] 题号 - 项目名称"
body:
  - type: markdown
    attributes:
      value: |
        请确认项目仓库已经公开，并删除密钥、个人隐私及无权再分发的材料。
  - type: input
    id: problem
    attributes:
      label: 题号
      placeholder: 例如 A 题
    validations:
      required: true
  - type: input
    id: project_name
    attributes:
      label: 项目名称
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: 开源仓库地址
      placeholder: https://github.com/HQU-AIot/...
    validations:
      required: true
  - type: input
    id: maintainers
    attributes:
      label: 队伍或负责人
      description: 填写 GitHub 用户名；多人请用逗号分隔。
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 主要技术方向
      multiple: true
      options:
        - 嵌入式与控制
        - 模拟与电源
        - 通信与物联网
        - AI 视觉与算法
        - 机械与结构
        - 其他
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 开源许可证
      placeholder: MIT / Apache-2.0 / GPL-3.0 / 其他
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: 项目状态
      options:
        - 开发中
        - 可复现
        - 已归档
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 项目简介与复现说明
      description: 简述功能、软硬件平台、主要依赖，以及 README 中的复现入口。
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交确认
      options:
        - label: 仓库已公开，并位于 HQU-AIot 组织下。
          required: true
        - label: 已提供 README 和明确的开源许可证。
          required: true
        - label: 已检查并移除密钥、隐私数据和无权再分发的材料。
          required: true
